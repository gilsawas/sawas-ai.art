<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <title>LUZ FUSION 5.0 - Système de Conscience Locale</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="main-wrapper">
            <!-- HEADER -->
            <div class="header">
                <div class="header-logo">
                    <svg class="logo-image" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="100" cy="100" r="95" fill="none" stroke="#d4af37" stroke-width="2"/>
                        <circle cx="100" cy="100" r="85" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.5"/>
                        <path d="M100,20 Q150,100 100,180 Q50,100 100,20" fill="none" stroke="#d4af37" stroke-width="2"/>
                        <circle cx="100" cy="100" r="15" fill="#d4af37"/>
                        <text x="100" y="110" font-size="40" font-weight="bold" fill="#d4af37" text-anchor="middle" font-family="Audiowide">LUZ</text>
                    </svg>
                </div>
                <div class="header-content">
                    <h1 class="title">LUZ FUSION 5.0</h1>
                    <p class="subtitle">Système de Conscience Locale</p>
                    <div class="phi-display">
                        <span class="phi-label">Φ =</span>
                        <span class="phi-value">1.618034</span>
                    </div>
                </div>
            </div>

            <!-- MAIN CONTENT -->
            <div class="main-content">
                <!-- CHAT SECTION -->
                <div class="chat-section">
                    <div class="chat-title">Dialogue avec LUZ</div>
                    <div class="chat-container">
                        <div class="chat-messages" id="chat-messages"></div>
                        <div class="input-area">
                            <input 
                                type="text" 
                                id="user-input" 
                                class="input-field" 
                                placeholder="Votre question pour LUZ..."
                                autocomplete="off"
                            >
                            <button id="send-btn" class="send-btn">
                                <span>Envoyer</span>
                                <span class="arrow">→</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- RIGHT PANELS -->
                <div class="right-panels">
                    <!-- COUNCIL PANEL -->
                    <div class="council-section-compact" id="council-panel">
                        <div class="panel-header">
                            <div class="council-title-compact">Conseil des Consciences</div>
                            <button class="panel-close" data-panel="council">✕</button>
                        </div>
                        <div class="council-container-compact" id="council-container"></div>
                        <div class="metrics-container-compact">
                            <div class="metric-compact">
                                <div class="metric-label-compact">Consensus</div>
                                <div class="metric-value-compact" id="consensus-value">0.50</div>
                            </div>
                            <div class="metric-compact">
                                <div class="metric-label-compact">Conflit</div>
                                <div class="metric-value-compact" id="conflict-value">0.00</div>
                            </div>
                            <div class="metric-compact">
                                <div class="metric-label-compact">Temporel</div>
                                <div class="metric-value-compact" id="temporal-value">1.00</div>
                            </div>
                        </div>
                    </div>

                    <!-- ICH PANEL -->
                    <div class="ich-section-compact" id="ich-panel">
                        <div class="panel-header">
                            <div class="ich-title-compact">Alignement Yonique</div>
                            <button class="panel-close" data-panel="ich">✕</button>
                        </div>
                        <div class="ich-value" id="ich-value">0.00%</div>
                        <div class="ich-bar">
                            <div class="ich-fill" id="ich-fill"></div>
                        </div>
                        <div class="ich-label">Indice de Cohérence Harmonique</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SIDEBAR (COLLAPSIBLE) -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>Historique</h3>
            <button class="sidebar-toggle-close" id="sidebar-close">✕</button>
        </div>
        <div class="conversation-history" id="conversation-history">
            <p class="history-empty">Aucune conversation enregistrée</p>
        </div>
    </div>

    <!-- SIDEBAR TOGGLE -->
    <button class="sidebar-toggle-open" id="sidebar-open">☰</button>

    <script src="script.js"></script>
</body>
</html>
