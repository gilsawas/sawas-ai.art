name: Deploy LUZ to Render

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy to Render
        run: |
          echo "Deployment triggered for LUZ FUSION 5.0"
          echo "Repository: gilsawas/sawas-ai.art"
          echo "Branch: main"
          echo "Service: luz-fusion-5"
          echo ""
          echo "✅ Push detected - Render will automatically deploy"
          echo "🌐 Access your app at: https://luz-fusion-5.onrender.com"
